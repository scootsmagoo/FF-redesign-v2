name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm --filter @ff/storefront build
      # Deploy only once the Cloudflare secrets exist (Settings → Secrets and variables → Actions).
      - id: gate
        run: echo "deployable=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to staging + e2e
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://filtersfast-storefront.adam-021.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm --filter @ff/storefront db:migrate:remote
      - name: Build and deploy the Worker
        run: pnpm --filter @ff/storefront cf:deploy
      - name: Install Playwright browser
        run: pnpm --filter @ff/storefront exec playwright install --with-deps chromium
      - name: Smoke-test staging
        run: pnpm --filter @ff/storefront e2e
        env:
          E2E_BASE_URL: https://filtersfast-storefront.adam-021.workers.dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/storefront/playwright-report
          retention-days: 14
